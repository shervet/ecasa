name: Idée ou fonctionnalité
description: Proposer une amélioration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Le besoin
      description: "Quel problème cela résout-il ? Dans quel contexte (chauffage, school planning, stats…) ?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: "Ce que tu imagines, même approximativement."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Solutions existantes essayées ?
